<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2ede5" />
    <title>LinkedIn Story Suggestions</title>
    <link rel="stylesheet" href="./styles.css?v=20260727-2" />
  </head>
  <body>
    <main class="app">
      <section class="hero">
        <h1>Build your BI-style graphic</h1>
      </section>

      <section class="workspace">
        <aside class="controls panel">
          <label class="field">
            <span>Source photo</span>
            <input id="photoInput" type="file" accept="image/*" />
          </label>

          <label class="field">
            <span>Headline</span>
            <textarea
              id="headlineInput"
              class="headline-input"
              rows="2"
              placeholder="Enter the headline, or use line breaks"
              spellcheck="true"
            ></textarea>
          </label>

          <label class="field">
            <span>Headline size</span>
            <input id="headlineSizeInput" type="range" min="15" max="24" step="0.1" />
          </label>

          <div class="field">
            <span>Headline position</span>
            <div class="segmented" role="radiogroup" aria-label="Headline position">
              <label>
                <input type="radio" name="headlinePosition" value="bottom" checked />
                <span>Bottom</span>
              </label>
              <label>
                <input type="radio" name="headlinePosition" value="top" />
                <span>Top</span>
              </label>
            </div>
          </div>

          <div class="field">
            <span>Black banner</span>
            <div class="segmented" role="radiogroup" aria-label="Black banner position">
              <label>
                <input type="radio" name="bannerPosition" value="off" checked />
                <span>Off</span>
              </label>
              <label>
                <input type="radio" name="bannerPosition" value="top" />
                <span>Top</span>
              </label>
              <label>
                <input type="radio" name="bannerPosition" value="bottom" />
                <span>Bottom</span>
              </label>
            </div>
          </div>

          <label class="field">
            <span>Black banner size</span>
            <input id="bannerHeightInput" type="range" min="80" max="360" step="1" />
          </label>

          <label class="field">
            <span>Fade height</span>
            <input id="fadePositionInput" type="range" min="0" max="1" step="0.01" />
          </label>

          <div class="field">
            <span>Fade position</span>
            <div class="segmented" role="radiogroup" aria-label="Fade position">
              <label>
                <input type="radio" name="fadeDirection" value="bottom" checked />
                <span>Bottom</span>
              </label>
              <label>
                <input type="radio" name="fadeDirection" value="top" />
                <span>Top</span>
              </label>
            </div>
          </div>

          <div class="grid-two">
            <label class="field">
              <span>Image zoom</span>
              <div class="zoom-control">
                <span class="zoom-end" aria-hidden="true">-</span>
                <input id="imageZoomInput" type="range" min="0.5" max="1.5" step="0.01" value="1" />
                <span class="zoom-end" aria-hidden="true">+</span>
              </div>
            </label>
            <div class="field">
              <span>Image position</span>
              <button id="recenterButton" type="button" class="secondary">Recenter</button>
            </div>
          </div>
          <p class="control-hint">Drag the preview image to move it around.</p>

          <div class="grid-two color-pickers">
            <div class="field">
              <span>BI logo color</span>
              <div class="segmented" role="radiogroup" aria-label="BI logo color">
                <label>
                  <input type="radio" name="logoColor" value="white" checked />
                  <span>White</span>
                </label>
                <label>
                  <input type="radio" name="logoColor" value="black" />
                  <span>Black</span>
                </label>
              </div>
            </div>

            <div class="field">
              <span>Headline color</span>
              <div class="segmented" role="radiogroup" aria-label="Headline color">
                <label>
                  <input type="radio" name="headlineColor" value="white" checked />
                  <span>White</span>
                </label>
                <label>
                  <input type="radio" name="headlineColor" value="black" />
                  <span>Black</span>
                </label>
              </div>
            </div>
          </div>

          <div class="actions">
            <button id="exportButton" type="button">Export PNG</button>
            <button id="resetButton" type="button" class="secondary">Clear content</button>
          </div>
        </aside>

        <section class="preview panel">
          <div class="canvas-frame">
            <div class="drop-hint" aria-hidden="true">
              Drop a photo here
            </div>
            <canvas id="canvas" width="1200" height="1500"></canvas>
          </div>
        </section>
      </section>
    </main>
    <script src="./app.js?v=20260820-banner-sizing"></script>
  </body>
</html>
